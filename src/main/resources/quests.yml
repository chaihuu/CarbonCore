# ============================================================
# CarbonCore quest definitions
# type:   KILL   - kill entities (target: entity type or ANY)
#         MINE   - break blocks   (target: material or ANY)
#         FISH   - fish items     (target: material or ANY)
#         LOGIN  - log into the server
#         TRADE  - trade with villagers (target: ANY)
#         COMPLETE - count of other quests completed
# reset:  daily | weekly | none
# ============================================================
quests:

  first_blood:
    enabled: true
    type: KILL
    target: ANY
    goal: 10
    reset: daily
    reward:
      money: 50.0
